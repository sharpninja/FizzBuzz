# FizzBuzz Implementation in G-code (Klipper)
# September 19, 2026
#
# "Write a program that prints the numbers from 1 to 100. But for multiples of
# three print “Fizz” instead of the number and for the multiples of five print
# “Buzz”. For numbers which are multiples of both three and five print
# “FizzBuzz”."
#
# The printer does the FizzBuzz math.  `_FB_CALC` applies n%15 / n%3 / n%5 and
# stores the label; `_FB_CELL` then plots that stored result with G0/G1.  There
# is no pre-baked list of 100 words and no host-language generator.
#
# ---------------------------------------------------------------------------
# Bed, origin, coordinate system
# ---------------------------------------------------------------------------
# Target firmware : Klipper
# Bed             : 256 mm x 256 mm
# Origin          : (0, 0, 0) = front-left of the bed after G28
# Axes            : X right, Y back, Z up  (standard Klipper Cartesian)
#
# Programmed motion stays inside an 18 mm margin (12 mm extra to the steel):
#
#     X, Y in [18.0, 238.0]
#     Z    in [1.2,  8.0 ]     (never below 1.2 mm on the default cold plot)
#
# Layout: 10 x 10 grid of 22 mm cells from (18, 18).
#   cell X = 18 + col * 22          col = (n-1) % 10     (0..9)
#   cell Y = 18 + (9-row) * 22      row = (n-1) // 10    (0..9)
# Row 0 (1..10) sits at the BACK (high Y) so a front webcam reads it like a page.
# Glyphs are inset 2.0..2.4 mm inside each cell, so strokes stay in [20, 236].
#
# ---------------------------------------------------------------------------
# Heat / homing / extrusion (safe defaults)
# ---------------------------------------------------------------------------
# Default is a COLD PLOT: heaters off, no E moves.  Tape a pen to the toolhead
# and lower Z_DRAW for ink, or watch the nozzle write the sequence in air.
#
#     FIZZBUZZ              cold plot, G28 first
#     FIZZBUZZ HOME=0       already homed; Z is trusted
#     FIZZBUZZ Z_DRAW=0.4   closer to the bed (pen contact; you own the crash)
#     FIZZBUZZ HEAT=1       PLA 200 C / bed 60 C and a hairline extrusion
#                           along the same calculated strokes
#
# ---------------------------------------------------------------------------
# How to load / run (Mainsail / Fluidd)
# ---------------------------------------------------------------------------
# 1. Copy this file to the printer config directory, e.g.
#        ~/printer_data/config/fizzbuzz.cfg
# 2. Add to printer.cfg:
#        [include fizzbuzz.cfg]
# 3. Restart Klipper (Firmware Restart).
# 4. Console or Macros panel:
#        FIZZBUZZ
#
# Do NOT upload this file as a print job.  It is Klipper config.  Jinja2 in a
# raw .gcode job is not evaluated; the macros below are what calculate.
#
# ---------------------------------------------------------------------------
# run_all.ps1
# ---------------------------------------------------------------------------
# Toolpath + M118 of the calculated labels.  Cannot hash-match FizzBuzz.txt.
# test_nobuild.json uses command `klipper` (not a host binary), so the runner
# skips this solution.

[gcode_macro _FB_LAYOUT]
variable_bed: 256.0
variable_x_min: 18.0
variable_x_max: 238.0
variable_y_min: 18.0
variable_y_max: 238.0
variable_x0: 18.0
variable_y0: 18.0
variable_cell: 22.0
variable_z_draw: 1.2
variable_z_hop: 8.0
gcode:
    {action_respond_info("FizzBuzz layout: 256x256 bed, 18 mm margin, 10x10 of 22 mm cells.")}

# Calculate the FizzBuzz term for N and store it on this macro.  The next
# command (_FB_CELL) reads printer["gcode_macro _FB_CALC"].label and plots it.
[gcode_macro _FB_CALC]
variable_label: ""
gcode:
    {% set n = params.N|int %}
    {% if n % 15 == 0 %}
        {% set result = "FizzBuzz" %}
    {% elif n % 3 == 0 %}
        {% set result = "Fizz" %}
    {% elif n % 5 == 0 %}
        {% set result = "Buzz" %}
    {% else %}
        {% set result = n|string %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_FB_CALC VARIABLE=label VALUE='"{result}"'
    M118 {result}

# Stroke-font plotter.  CHAR is one character of the label _FB_CALC stored.
# Glyphs live in the unit square (origin = bottom-left of the character box).
[gcode_macro _FB_DRAW_CHAR]
gcode:
    {% set L = printer["gcode_macro _FB_LAYOUT"] %}
    {% set ch = params.CHAR|string %}
    {% set ox = params.X|float %}
    {% set oy = params.Y|float %}
    {% set w  = params.W|float %}
    {% set h  = params.H|float %}
    {% set z_draw = params.Z_DRAW|default(L.z_draw)|float %}
    {% set z_hop  = params.Z_HOP|default(L.z_hop)|float %}
    {% set feed   = params.FEED|default(900)|float %}
    {% set heat   = params.HEAT|default(0)|int %}
    {% set glyphs = {
        "0": [ [[0.18,0.12],[0.18,0.88],[0.82,0.88],[0.82,0.12],[0.18,0.12]] ],
        "1": [ [[0.30,0.70],[0.50,0.90],[0.50,0.12]], [[0.24,0.12],[0.76,0.12]] ],
        "2": [ [[0.16,0.72],[0.22,0.86],[0.40,0.94],[0.64,0.94],[0.80,0.84],[0.82,0.70],[0.70,0.54],[0.18,0.12],[0.84,0.12]] ],
        "3": [ [[0.16,0.88],[0.78,0.88],[0.50,0.56],[0.76,0.44],[0.80,0.26],[0.68,0.12],[0.30,0.10],[0.16,0.22]] ],
        "4": [ [[0.70,0.12],[0.70,0.90],[0.18,0.40],[0.86,0.40]] ],
        "5": [ [[0.80,0.90],[0.22,0.90],[0.18,0.54],[0.68,0.56],[0.84,0.42],[0.82,0.22],[0.62,0.10],[0.24,0.12],[0.16,0.24]] ],
        "6": [ [[0.76,0.86],[0.40,0.94],[0.20,0.76],[0.18,0.24],[0.32,0.10],[0.68,0.10],[0.84,0.24],[0.82,0.46],[0.60,0.56],[0.22,0.48]] ],
        "7": [ [[0.16,0.90],[0.84,0.90],[0.36,0.12]] ],
        "8": [ [[0.50,0.52],[0.22,0.62],[0.20,0.82],[0.36,0.94],[0.64,0.94],[0.80,0.82],[0.78,0.62],[0.50,0.52],[0.22,0.40],[0.18,0.22],[0.34,0.08],[0.66,0.08],[0.82,0.22],[0.78,0.40],[0.50,0.52]] ],
        "9": [ [[0.22,0.16],[0.60,0.08],[0.80,0.24],[0.82,0.76],[0.68,0.92],[0.32,0.92],[0.18,0.76],[0.20,0.56],[0.42,0.46],[0.80,0.54]] ],
        "F": [ [[0.20,0.10],[0.20,0.90],[0.84,0.90]], [[0.20,0.54],[0.70,0.54]] ],
        "B": [ [[0.20,0.10],[0.20,0.90],[0.62,0.90],[0.80,0.78],[0.80,0.62],[0.62,0.52],[0.20,0.52]], [[0.62,0.52],[0.84,0.40],[0.84,0.22],[0.64,0.10],[0.20,0.10]] ],
        "i": [ [[0.50,0.10],[0.50,0.52]], [[0.50,0.72],[0.50,0.86]] ],
        "z": [ [[0.16,0.88],[0.84,0.88],[0.16,0.12],[0.84,0.12]] ],
        "u": [ [[0.18,0.90],[0.18,0.28],[0.30,0.12],[0.70,0.12],[0.82,0.28],[0.82,0.90]] ]
    } %}
    {% set strokes = glyphs[ch] if ch in glyphs else [] %}
    {% for stroke in strokes %}
        {% for i in range(stroke|length) %}
            {% set px = [L.x_min, [L.x_max, ox + stroke[i][0] * w]|min]|max %}
            {% set py = [L.y_min, [L.y_max, oy + stroke[i][1] * h]|min]|max %}
            {% if i == 0 %}
                G0 Z{z_hop} F600
                G0 X{px} Y{py} F6000
                G1 Z{z_draw} F600
                {% if heat %}
                    G92 E0
                {% endif %}
            {% else %}
                {% if heat %}
                    G1 X{px} Y{py} E0.012 F{feed}
                {% else %}
                    G1 X{px} Y{py} F{feed}
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    G0 Z{z_hop} F600

# Plot the calculated string left-to-right inside a box.
[gcode_macro _FB_DRAW_TEXT]
gcode:
    {% set text = params.TEXT|string %}
    {% set ox = params.X|float %}
    {% set oy = params.Y|float %}
    {% set box_w = params.W|float %}
    {% set box_h = params.H|float %}
    {% set z_draw = params.Z_DRAW|default(1.2)|float %}
    {% set z_hop  = params.Z_HOP|default(8.0)|float %}
    {% set heat   = params.HEAT|default(0)|int %}
    {% set nch = text|length %}
    {% if nch > 0 %}
        {% set gap = 0.45 %}
        {% set cw = (box_w - gap * (nch - 1)) / nch %}
        {% for i in range(nch) %}
            _FB_DRAW_CHAR CHAR={text[i]} X={ox + i * (cw + gap)} Y={oy} W={cw} H={box_h} Z_DRAW={z_draw} Z_HOP={z_hop} HEAT={heat}
        {% endfor %}
    {% endif %}

# Plot one grid cell from the label that `_FB_CALC` just stored.  N is only
# used to place the cell; the letters come from the calculated result.
[gcode_macro _FB_CELL]
gcode:
    {% set L = printer["gcode_macro _FB_LAYOUT"] %}
    {% set n = params.N|int %}
    {% set label = printer["gcode_macro _FB_CALC"].label %}
    {% set z_draw = params.Z_DRAW|default(L.z_draw)|float %}
    {% set z_hop  = params.Z_HOP|default(L.z_hop)|float %}
    {% set heat   = params.HEAT|default(0)|int %}
    {% set row = (n - 1) // 10 %}
    {% set col = (n - 1) % 10 %}
    {% set cx = L.x0 + col * L.cell %}
    {% set cy = L.y0 + (9 - row) * L.cell %}
    {% if label == "FizzBuzz" %}
        _FB_DRAW_TEXT TEXT=Fizz X={cx + 2.0} Y={cy + L.cell * 0.50} W={L.cell - 4.0} H={L.cell * 0.38} Z_DRAW={z_draw} Z_HOP={z_hop} HEAT={heat}
        _FB_DRAW_TEXT TEXT=Buzz X={cx + 2.0} Y={cy + 2.2} W={L.cell - 4.0} H={L.cell * 0.38} Z_DRAW={z_draw} Z_HOP={z_hop} HEAT={heat}
    {% else %}
        _FB_DRAW_TEXT TEXT={label} X={cx + 2.4} Y={cy + 5.0} W={L.cell - 4.8} H={L.cell - 9.0} Z_DRAW={z_draw} Z_HOP={z_hop} HEAT={heat}
    {% endif %}

[gcode_macro FIZZBUZZ]
description: Calculate FizzBuzz 1-100 and plot it on a 256x256 mm bed
gcode:
    {% set L = printer["gcode_macro _FB_LAYOUT"] %}
    {% set home   = params.HOME|default(1)|int %}
    {% set heat   = params.HEAT|default(0)|int %}
    {% set z_draw = params.Z_DRAW|default(L.z_draw)|float %}
    {% set z_hop  = params.Z_HOP|default(L.z_hop)|float %}
    {% if z_draw < 0.2 %}
        {action_raise_error("Z_DRAW is below 0.2 mm; refusing to scrape the bed.")}
    {% endif %}
    G90
    G21
    M107
    {% if heat %}
        M140 S60
        M104 S200
        M190 S60
        M109 S200
        M83
    {% else %}
        M104 S0
        M140 S0
    {% endif %}
    {% if home %}
        G28
    {% endif %}
    G0 Z{z_hop} F600
    M118 FizzBuzz 1-100 on 256x256 (Klipper)
    {% for n in range(1, 101) %}
        _FB_CALC N={n}
        _FB_CELL N={n} Z_DRAW={z_draw} Z_HOP={z_hop} HEAT={heat}
    {% endfor %}
    G0 Z{z_hop} F600
    G0 X{L.x_min} Y{L.y_max} F6000
    M400
    M118 FizzBuzz plot complete
