# Minimal 256x256 Cartesian printer for Klippy batch / fileoutput simulation.
# Pins match the linux-process MCU dictionary (gpio0.. / analog0..).
# Not a real machine config — used to execute FIZZBUZZ N=100 without hardware.

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 3000
max_z_velocity: 50
max_z_accel: 200

[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3
position_endstop: 0
position_min: 0
position_max: 256
homing_speed: 50

[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio7
position_endstop: 0
position_min: 0
position_max: 256
homing_speed: 50

[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio11
position_endstop: 0.2
position_min: 0
position_max: 50
homing_speed: 10

[extruder]
step_pin: gpio12
dir_pin: gpio13
enable_pin: !gpio14
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.40
filament_diameter: 1.75
heater_pin: gpio15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 280
min_extrude_temp: 0

[heater_bed]
heater_pin: gpio16
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog1
control: watermark
min_temp: 0
max_temp: 120

[fan]
pin: gpio17

[force_move]
enable_force_move: True

[respond]
default_type: echo

# Capture expanded motion for the batch simulator / preview renderer.
[gcode_macro G0]
rename_existing: G0.1
gcode:
    {% if "X" in params or "Y" in params or "Z" in params %}
        {action_respond_info("PATH G0 " ~ rawparams)}
    {% endif %}
    G0.1 {rawparams}

[gcode_macro G1]
rename_existing: G1.1
gcode:
    {% if "X" in params or "Y" in params or "Z" in params or "E" in params %}
        {action_respond_info("PATH G1 " ~ rawparams)}
    {% endif %}
    G1.1 {rawparams}

[include ../fizzbuzz.cfg]
